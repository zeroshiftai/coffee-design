<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 86" fill="none">
  <defs>
    <linearGradient id="chipGlass" x1="0" y1="0" x2="200" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="chipShadow" x="-15%" y="-25%" width="130%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#chipShadow)">
    <rect x="4" y="4" width="192" height="78" rx="18" fill="#10182C" fill-opacity="0.82" stroke="url(#chipGlass)"/>
    <rect x="4" y="4" width="192" height="78" rx="18" fill="url(#chipGlass)"/>
    <text x="24" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#7C5CFF">&lt;motion</text>
    <text x="24" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#41D1FF">  depth={7}</text>
    <text x="110" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#FFFFFFAA">/&gt;</text>
  </g>
</svg>
